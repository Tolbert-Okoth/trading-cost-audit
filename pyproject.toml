[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costaudit"
version = "0.1.0"
description = "Trading cost audit: rebuild mid-to-mid gross edge from fill ledgers, breakeven cost, cost grids, Carver's speed limit and live spread-drift monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["transaction costs", "spread", "trading", "backtest", "execution", "quant research"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
